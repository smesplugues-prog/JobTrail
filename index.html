<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://generativelanguage.googleapis.com https://r.jina.ai https://cdn.jsdelivr.net; worker-src blob:; frame-src about:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>JobTrail – Job search dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#dashboard" aria-label="JobTrail home">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="6" fill="#0f766e"/><path d="M7 15.5l3.2-3.2 2.3 2.3L17 10" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>JobTrail</span>
      </a>
      <nav class="topnav" aria-label="Primary">
        <a href="#dashboard" data-nav="dashboard">Dashboard</a>
        <a href="#jobs" data-nav="jobs">Jobs to Review</a>
        <a href="#applications" data-nav="applications">Applications</a>
        <a href="#calendar" data-nav="calendar">Interviews Calendar</a>
      </nav>
      <button class="btn ghost theme-btn" type="button" data-action="toggle-theme" aria-pressed="false" aria-label="Dark mode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg><span class="theme-label">Dark</span></button>
      <button class="btn ghost" type="button" data-action="open-profile">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        <span>Profile</span>
      </button>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <nav class="bottomnav" aria-label="Primary (mobile)">
    <a href="#dashboard" data-nav="dashboard">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>Dashboard</span>
    </a>
    <a href="#jobs" data-nav="jobs">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2"/></svg>
      <span>Jobs</span>
    </a>
    <a href="#applications" data-nav="applications">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
      <span>Applications</span>
    </a>
    <a href="#calendar" data-nav="calendar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Calendar</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="appDialog" class="drawer"></dialog>
  <dialog id="profileDialog" class="drawer"></dialog>
  <dialog id="jobDialog" class="drawer"></dialog>
  <dialog id="aiDialog" class="drawer wide"></dialog>
  <dialog id="cvDialog" class="drawer wide"></dialog>
  <dialog id="calDialog" class="drawer wide"></dialog>
  <dialog id="outDialog" class="drawer wide"></dialog>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
